name: Validate bot submission

on:
  pull_request:
    paths:
      - scripts/**
      - templates/**
      - tests/**
      - .github/workflows/validate.yml
      - .github/workflows/publish-catalog.yml
      - .github/workflows/verify-catalog.yml
      - .github/workflows/moderate.yml
      - .github/workflows/manual-moderation.yml
      - moderation/**

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      RUMBLE_TEMPLATE_SMOKE: '1'
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read the Rumble's supported runtime versions
        id: runtimes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        # The one list of the versions the Rumble supports is in the Rumble client's latest release; this workflow
        # names none of its own, so bots are checked on exactly what the Rumble runs.
        run: |
          tag=$(gh api repos/robocode-dev/rumble-client/releases/latest --jq .tag_name)
          gh api "repos/robocode-dev/rumble-client/contents/src/main/resources/runtime-versions.properties?ref=$tag" \
            -H "Accept: application/vnd.github.raw" > "$RUNNER_TEMP/runtime-versions.properties"
          for name in java dotnet python node; do
            value=$(sed -n "s/^$name=//p" "$RUNNER_TEMP/runtime-versions.properties" | tr -d '\r')
            test -n "$value" || { echo "The Rumble's runtime list names no $name version."; exit 1; }
            echo "$name=$value" >> "$GITHUB_OUTPUT"
          done
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.runtimes.outputs.python }}
      # Java bots run from source (Java 22+ multi-file launch), on the Rumble's JVM.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.runtimes.outputs.java }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ steps.runtimes.outputs.dotnet }}.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.runtimes.outputs.node }}
      - run: python -m pip install -r templates/python/StarterBot/requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Reject hand-edited generated catalog files
        run: |
          if git cat-file -e origin/${{ github.base_ref }}:bots/index.json 2>/dev/null && git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -qx 'bots/index.json'; then
            echo 'bots/index.json is generated by CI and cannot be edited in a pull request.'
            exit 1
          fi
          if git cat-file -e origin/${{ github.base_ref }}:bots/owners.json 2>/dev/null && git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -qx 'bots/owners.json'; then
            echo 'bots/owners.json is generated by CI and cannot be edited in a pull request.'
            exit 1
          fi
      # This workflow covers implementation changes; bot submissions receive ownership
      # checks from the moderation workflow. A merged bot may await catalog publication.
      - run: python scripts/validate_bot.py --root . --owner '${{ github.event.pull_request.user.login }}' --smoke --skip-governance
